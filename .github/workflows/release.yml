name: Release

on:
  push:
    tags: ["v*"]        # e.g. git tag v1.0.0 && git push origin v1.0.0
  workflow_dispatch:     # or run manually from the Actions tab (uploads an artifact only)

permissions:
  contents: write        # needed to create the GitHub Release

jobs:
  build-dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Download Metal Toolchain (required by MLX)
        run: xcodebuild -downloadComponent MetalToolchain || echo "Metal toolchain already present"

      - name: Build DMG
        run: ./scripts/make-dmg.sh "${GITHUB_REF_NAME}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bytopolis-dmg
          path: dist/*.dmg

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.dmg \
            --title "Bytopolis ${GITHUB_REF_NAME}" \
            --generate-notes \
          || gh release upload "${GITHUB_REF_NAME}" dist/*.dmg --clobber
